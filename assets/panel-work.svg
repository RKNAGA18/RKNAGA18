<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500">
  <rect width="1240" height="500" fill="#07090D"/>
  <rect x="12" y="12" width="1216" height="476" rx="4" fill="#0B0E13" stroke="#202833"/>
  <rect x="12" y="12" width="1216" height="3" fill="#E11D2E"/>
  <text x="40" y="52" fill="#E11D2E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2">ENGINEERING &amp; RESEARCH</text>
  <text x="1172" y="52" fill="#2563D9" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">01</text>
  <line x1="40" y1="66" x2="1200" y2="66" stroke="#202833"/>
  <rect x="40" y="88" width="540" height="365" rx="4" fill="#090C11" stroke="#243142"/>
  <text x="62" y="116" fill="#D9A62E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700">RESEARCH &amp; ENGINEERING</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="62" y="138" width="4" height="55" fill="#E11D2E"/>
    <text x="80" y="155" fill="#F4F7FA" font-size="13" font-weight="700">ASIC Design &amp; Physical Design</text>
    <text x="80" y="175" fill="#8D98A8" font-size="11">RTL, synthesis, timing constraints and RTL-to-GDSII</text>
    <text x="80" y="189" fill="#8D98A8" font-size="11">flows using open-source tooling.</text>

    <rect x="62" y="209" width="4" height="55" fill="#2563D9"/>
    <text x="80" y="226" fill="#F4F7FA" font-size="13" font-weight="700">RISC-V &amp; Computer Architecture</text>
    <text x="80" y="246" fill="#8D98A8" font-size="11">RISC-V architectures, processor design, assertions</text>
    <text x="80" y="260" fill="#8D98A8" font-size="11">and open-source processor ecosystems.</text>

    <rect x="62" y="280" width="4" height="55" fill="#D9A62E"/>
    <text x="80" y="297" fill="#F4F7FA" font-size="13" font-weight="700">AI Hardware</text>
    <text x="80" y="317" fill="#8D98A8" font-size="11">Systolic arrays, edge AI accelerators and</text>
    <text x="80" y="331" fill="#8D98A8" font-size="11">hardware-software co-design.</text>

    <rect x="62" y="351" width="4" height="55" fill="#E11D2E"/>
    <text x="80" y="368" fill="#F4F7FA" font-size="13" font-weight="700">Semiconductor Devices</text>
    <text x="80" y="388" fill="#8D98A8" font-size="11">GaN HEMTs, TCAD simulation, breakdown voltage</text>
    <text x="80" y="402" fill="#8D98A8" font-size="11">and electric-field optimization.</text>
  </g>
  <rect x="600" y="88" width="600" height="365" rx="4" fill="#090C11" stroke="#243142"/>
  <text x="622" y="116" fill="#2563D9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700">HARDWARE HIGHLIGHTS</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="622" y="138" width="4" height="50" fill="#2563D9"/>
    <text x="640" y="156" fill="#F4F7FA" font-size="13" font-weight="700">2x2 Systolic Array</text>
    <text x="640" y="175" fill="#8D98A8" font-size="11">SystemVerilog • matrix multiplication • AI NPU</text>

    <rect x="622" y="201" width="4" height="50" fill="#E11D2E"/>
    <text x="640" y="219" fill="#F4F7FA" font-size="13" font-weight="700">10G Ethernet MAC</text>
    <text x="640" y="238" fill="#8D98A8" font-size="11">Verilog • packet framing • preamble • IPG control</text>

    <rect x="622" y="264" width="4" height="50" fill="#D9A62E"/>
    <text x="640" y="282" fill="#F4F7FA" font-size="13" font-weight="700">FPGA PCB Defect Detection</text>
    <text x="640" y="301" fill="#8D98A8" font-size="11">Machine learning • Vivado • hardware acceleration</text>

    <rect x="622" y="327" width="4" height="50" fill="#2563D9"/>
    <text x="640" y="345" fill="#F4F7FA" font-size="13" font-weight="700">Neuromorphic CNN / CrossSim</text>
    <text x="640" y="364" fill="#8D98A8" font-size="11">Hardware-software co-design • memristive arrays</text>

    <rect x="622" y="390" width="4" height="50" fill="#E11D2E"/>
    <text x="640" y="408" fill="#F4F7FA" font-size="13" font-weight="700">Open-Source Processor Work</text>
    <text x="640" y="427" fill="#8D98A8" font-size="11">RISC-V • BlackParrot • OpenTitan • Ibex</text>
